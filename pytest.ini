[pytest]
# asyncio_mode=auto: i test async del progetto sono scritti senza
# @pytest.mark.asyncio (solo 7 file su 91 lo usano). Senza questa riga
# pytest raccoglie la coroutine, non la attende e fallisce con
# "async def functions are not natively supported" — 35 test rossi
# che non hanno nulla che non va. I file col marker restano validi.
asyncio_mode = auto
testpaths = tests
